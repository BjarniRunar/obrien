# Engine settings for CRS in obrien, loaded before the CRS setup and rules.
# Based on coraza.conf-recommended, without the response, audit log and
# data directory settings, which obrien does not use.

# Always On: whether an interruption blocks the request is decided by obrien
# (--crs block or detect), not by the engine.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecAuditEngine Off

SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
     "id:'200006',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule URI_PARSE_ERROR "@eq 1" \
    "id:'200009',phase:1,t:none,log,deny,status:400,msg:'URI failed to parse.'"

SecRequestBodyJsonDepthLimit 1024
SecArgumentsLimit 1000

# Bodies are inspected up to the limit and the rest is passed on unread, so
# large uploads still work. The limits are set by NewCRS (CRSConfig.BodyLimit).
SecRequestBodyLimitAction ProcessPartial

SecRule REQBODY_ERROR "!@eq 0" \
    "id:'200002', phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:'200003',phase:2,t:none,log,deny,status:400, \
    msg:'Multipart request body failed strict validation.', \
    logdata:'MULTIPART_DUPLICATE_PART_HEADER=%{MULTIPART_DUPLICATE_PART_HEADER}, \
    MULTIPART_INVALID_QUOTING=%{MULTIPART_INVALID_QUOTING}'"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:'200004',phase:1,t:none,log,deny,status:400, \
    msg:'Argument limit reached; request rejected (GET/PATH args)'"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:'200005',phase:2,t:none,log,deny,status:400, \
    msg:'Argument limit reached; request rejected (POST args)'"
